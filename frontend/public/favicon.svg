  <line x1="22" y1="11.5" x2="18" y2="14.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="20.5" x2="18" y2="17.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="25" x2="16" y2="18.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="20.5" x2="14" y2="17.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="11.5" x2="14" y2="14.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <!-- 外围小点 -->
  <circle cx="16" cy="5" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="24" cy="10" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="24" cy="22" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="16" cy="27" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="8" cy="22" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="8" cy="10" r="1.2" fill="white" opacity="0.5"/>
</svg>
