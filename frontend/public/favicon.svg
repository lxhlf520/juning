  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- 中心六边形 -->
  <polygon points="16,7 22,11.5 22,20.5 16,25 10,20.5 10,11.5" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
